# titel: Text in der Titelleiste
# variable: Name der Benutzervariable
# spalten: Buttons nebeneinander, danach beginnt eine neue Zeile
# darkmode: true für dunkle Farben, false oder weglassen für hell
# applikation.aktion: none, kill oder restart
# applikation.name: eine Exe oder eine Liste von Exe-Dateien, die beendet werden
# applikation.startbefehl: Kommandozeile für den Neustart
# applikation.arbeitsverzeichnis: Ordner für den Neustart, vollständiger Pfad
# applikation.starten: true startet nur, wenn inhibit nicht läuft. Das gilt auch bei restart
# applikation.inhibit: läuft diese Exe und starten ist true, wird nicht gestartet
# fatclient: Text des Buttons, der die Variable entfernt
titel: Arbeitsplatz festlegen
darkmode: false
variable: IGELNAME
spalten: 5
fatclient: Notebook/Workstation
applikation:
  aktion: kill
  name: 
    - cts32.exe
    - labor32.exe
  startbefehl: 'C:\Program Files (x86)\Inlog\Synchro\Lance32.exe'
  arbeitsverzeichnis: 'C:\Program Files (x86)\Inlog\Synchro\'
  starten: true
  inhibit: appli32.exe
gruppen:
  - name: Labor
    buttons:
      - anzeigename: Labb2platz
        wert: Igel1
      - anzeigename: Labaplatz
        wert: Igel22
  - name: Büro
    buttons:
      - anzeigename: Eintrag 2
        wert: Igel05
      - anzeigename: Eintrag 3
        wert: Igel6
      - anzeigename: Eintrag 4
        wert: Igel7
      - anzeigename: Eintrag 2
        wert: Igel8
      - anzeigename: Eintrag 3
        wert: Igel9
      - anzeigename: Eintrag 2
        wert: Igel10
      - anzeigename: Eintrag 3
        wert: Igel11
